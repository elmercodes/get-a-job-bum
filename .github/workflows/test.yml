name: Test forms

# Every push: start the server with a made-up demo profile (no AI key, no Gmail) and fill all test forms in headless Chrome.
on:
  push:
  pull_request:

jobs:
  forms:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Check tracked paths
        run: bash ../scripts/privacy-preflight.sh
      - name: Run fictional browser and API tests
        env:
          CHROME: /usr/bin/google-chrome
        run: bash ../scripts/test-phase1.sh

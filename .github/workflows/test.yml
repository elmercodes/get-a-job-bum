name: Test forms

# Every push: start the server with a made-up demo profile (no AI key, no Gmail) and fill all test forms in headless Chrome.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  forms:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Verify syntax, whitespace and license metadata
        run: |
          git diff --check HEAD^ HEAD
          node ../scripts/release-check.mjs
      - name: Check tracked paths
        run: bash ../scripts/privacy-preflight.sh
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Scan Git history for secrets
        working-directory: .
        run: |
          GOBIN="$RUNNER_TEMP" go install github.com/zricethezav/gitleaks/v8@v8.24.3
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner
      - name: Run fictional browser and API tests
        env:
          CHROME: /usr/bin/google-chrome
        run: bash ../scripts/test-phase1.sh

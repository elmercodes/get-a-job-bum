<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Data Engineer at Fictional South Labs</title>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "JobPosting",
  "title": "Data Engineer",
  "hiringOrganization": {"@type": "Organization", "name": "Fictional South Labs"},
  "jobLocation": {"@type": "Place", "address": {"addressLocality": "Fiction City", "addressCountry": "US"}},
  "description": "SQL reporting experience is required. Reduce reporting time and use SQL for data validation. AWS certification is preferred."
}
</script>
<main>
  <h1>Data Engineer at Fictional South Labs</h1>
  <p>Required qualifications include SQL reporting experience and a track record in reducing reporting time for data validation.</p>
  <form action="phase3-form.html">
    <label for="resume">Resume</label>
    <input id="resume" name="resume" type="file" accept=".docx" required>
    <label><input id="marketing" type="checkbox"> Subscribe to promotional email</label>
    <button type="submit">Submit application</button>
  </form>
</main>
<script>
document.querySelector('form').addEventListener('submit', (event) => {
  event.preventDefault();
  document.documentElement.dataset.submitted = 'yes';
});
</script>
</html>

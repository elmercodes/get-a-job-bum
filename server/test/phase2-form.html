<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Fictional evidence form</title>
<main>
  <h1>Fictional application</h1>
  <form>
    <label for="last">Last Name</label>
    <input id="last" name="last" required>
    <label for="method">How should we contact you?</label>
    <select id="method" name="method" required>
      <option value="">Choose…</option>
      <option>Email</option>
      <option>Phone</option>
    </select>
    <label><input id="privacy" type="checkbox" aria-describedby="privacyNotice" required> I acknowledge the privacy policy</label>
    <p id="privacyNotice">Fictional Example Employer retains the submitted application for six months.</p>
    <button type="submit">Submit application</button>
  </form>
</main>
</html>
